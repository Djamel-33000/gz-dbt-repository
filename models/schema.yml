
version: 2

sources:
  - name: raw
    database: lewagon-485210
    schema: gz_raw_data
    description: "dataset de notre gz_raw_data"
    config:
     freshness:
      warn_after: {count: 90, period: day}
    tables: # <--- C'est ici que tout doit commencer
      - name: produit
        identifier: raw_gz_product
        description: liste des produits 
        columns:
          - name: products_id
            tests:
              - not_null
              - unique

      - name: vente
        identifier: raw_gz_sales
        config:
          loaded_at_field: "CAST(date_date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
        columns:
          - name: date_date
          - name: orders_id
          - name: pdt_id

      - name: livraison
        identifier: raw_gz_ship
        description: table des expeditions
        columns: 
          - name: orders_id
            tests:
              - not_null
              - unique

